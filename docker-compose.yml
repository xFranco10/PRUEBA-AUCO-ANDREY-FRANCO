services:
  # MongoDB: base principal donde se guardan las validaciones.
  # El puerto del host se puede cambiar con MONGO_PORT (ej. si ya tienes un Mongo local en 27017).
  mongo:
    image: mongo:8
    container_name: auco-mongo
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db

  # DynamoDB Local: emulador oficial de AWS para desarrollo (no cobra ni requiere cuenta AWS)
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: auco-dynamodb-local
    # -sharedDb: una sola base sin importar región/credenciales; -dbPath: persiste en disco
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    # Se ejecuta como root para poder escribir en el volumen nombrado
    user: root
    ports:
      - '8000:8000'
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

volumes:
  mongo-data:
  dynamodb-data:
